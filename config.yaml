service:
  host: "127.0.0.1"            # 默认只监听本机;若要局域网访问改 0.0.0.0,并务必设下面的 api_key
  port: 8765
  pause_on_start: false
  api_key: ""                  # 设为非空后,所有接口(除健康检查/登录)需 X-API-Key 头或登录;空=不鉴权
  allowed_origins: []          # CORS 白名单;空=仅同源(默认安全)
  trusted_hosts: ["*"]         # Host 头白名单;["*"] 关闭校验,绑 0.0.0.0 时建议填实际主机名/IP

inference:
  device: "cpu"             # Win 生产在 config.local.yaml 覆盖为 cuda:0
  yolo_model: "models/yolo11s.pt"
  yolo_conf: 0.20
  yolo_confirm_frames: 3
  imgsz: 640
  active_fps: 6
  idle_fps: 1
  motion_threshold: 25
  min_crop_px: 80
  reid_backbone: "efficientnet_b0"   # 认猫骨干网。想要更强的个体区分可换 "dinov2_vits14"
                                      # (自监督 ViT,首次需联网下载~85MB;换后须重建每只猫的 refs)
  reid_grayscale: true               # 在灰度域做嵌入 → 白天彩色 + 夜间红外用同一套画廊
  reid_topk: 3                       # 多向量画廊:取与该猫参考集最相似的前 k 个余弦的均值
  color_bonus_enabled: true          # 白天颜色加成(夜间红外自动关闭)
  color_weight: 0.3                  # 颜色相似度在最终分里的权重(0~1)
  color_min_saturation: 25.0         # 平均饱和度低于此视为灰度/红外,跳过颜色
  similarity_threshold: 0.55
  fusion: "weighted_median"
  fusion_max_frames: 64
  fp16: false               # half precision; only applied when device is cuda:*
  # 接受为"猫"的 COCO 类别:蹲着/背对的猫常被 YOLO 误判成羊/狗/熊,盆里又只会有猫,
  # 所以放宽到这组动物类,避免漏检导致一次如厕被切成多段。15猫16狗17马18羊19牛21熊77泰迪熊
  detect_class_ids: [15, 16, 17, 18, 19, 21, 77]

cats:
  min_refs: 5
  seed:
    - { id: mimi, name: "咪咪" }
    - { id: cat2, name: "猫2" }
    - { id: cat3, name: "猫3" }
    - { id: cat4, name: "猫4" }
    - { id: cat5, name: "猫5" }

cameras:
  # 整盆基本占满画面,所以默认 ROI = 全画面(归一化 0~1,与分辨率无关)。
  # 想只圈一部分砂区就改成更小的 0~1 多边形,例如 [[0.14,0.13],[0.88,0.13],[0.88,0.95],[0.14,0.95]]。
  - id: cam1
    rtsp_url: "rtsp://user:pass@192.168.1.101:554/stream1"
    weight: 0.5
    roi_polygon: [[0, 0], [1, 0], [1, 1], [0, 1]]
  - id: cam2
    rtsp_url: "rtsp://user:pass@192.168.1.102:554/stream1"
    weight: 0.5
    roi_polygon: [[0, 0], [1, 0], [1, 1], [0, 1]]

session:
  roi_overlap_min: 0.25
  enter_overlap_sec: 2.0
  exit_no_cat_sec: 20.0      # 容忍猫转身/埋头十几秒不误判结束(时长按"最后一次看到猫"算,不会虚高)
  cooldown_sec: 3.0
  min_visit_sec: 3.0

preprocess:
  input_mode: "bgr"
  clahe_enabled: true
  denoise_enabled: false

recorder:
  enabled: true
  primary_camera: "cam1"
  record_cameras: ["cam1", "cam2"]   # 录两路视角(主+辅);只想录主摄就删掉这行
  max_seconds: 300                   # 录像片段上限(秒);时长记录不受此限,始终是完整墙钟
  min_free_mb: 500                   # 剩余磁盘低于此:暂停录像,并按时间从旧到新轮转删除
  retention_days: 0                  # 自动删除超过该天数的录像(0=永久保留);与 min_free_mb 一起防止占满盘

mqtt:
  # 启用需 pip install paho-mqtt。发布主题:<prefix>/visit_ended、<prefix>/alert/low_disk、
  # <prefix>/alert/frame_errors。可接 Home Assistant 做掉线/满盘/如厕通知。
  enabled: false
  broker_host: "192.168.1.1"
  broker_port: 1883
  topic_prefix: "stupid-cat/visit"
  username: ""
  password: ""

waste:
  enabled: true              # 启发式屎/尿分类(非医疗级,阈值需按真实数据调)
  min_duration_sec: 8        # 短于此一律 unknown(只是闻一闻/路过,不是排泄)
  pee_max_duration_sec: 90   # 短于此 + 后段刨砂少 → 尿
  poop_min_duration_sec: 120 # 长于此 + 后段刨砂多 → 屎
  dig_motion_threshold: 40   # 后段帧差均值高于此算"刨砂"
