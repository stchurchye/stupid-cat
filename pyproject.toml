[project]
name = "stupid-cat"
version = "0.1.0"
description = "Five-cat litter box vision monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pyyaml>=6.0",
  # Upper bounds keep production on a torch/torchvision generation whose CUDA
  # wheels still ship Pascal (sm_61) kernels for the GTX 1060. See
  # requirements-win-cuda.txt for the exact +cu121 pins used on the Windows box.
  "torch>=2.2,<2.6",
  "torchvision>=0.17,<0.21",
  "Pillow>=10.0",
  "ultralytics>=8.3,<9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "torch>=2.2,<2.6",
  "torchvision>=0.17,<0.21",
  "ultralytics>=8.3,<9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gpu: tests that load YOLO weights (optional)",
]
