[project]
name = "stupid-cat"
version = "0.1.0"
description = "Five-cat litter box vision monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pyyaml>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "Pillow>=10.0",
  "ultralytics>=8.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gpu: tests that load YOLO weights (optional)",
]
